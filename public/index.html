<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    
    <!-- Anti-Indexing & Privacy: Impede que robôs e mecanismos de busca indexem o app -->
    <meta name="robots" content="noindex, nofollow, noarchive, nosnippet" />
    <meta name="googlebot" content="noindex, nofollow, noarchive, nosnippet" />
    <meta name="bingbot" content="noindex, nofollow, noarchive, nosnippet" />

    <!-- Otimizações PWA & iOS (Adicionar à Tela de Início / Save to Home Screen) -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Namovo" />
    <meta name="application-name" content="Namovo" />
    <meta name="theme-color" content="#FDFBFB" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />

    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/favicon.png" />
    <link rel="icon" type="image/png" href="/favicon.png" />

    <title>Namovo — Nosso Espaço</title>

    <!-- The `react-native-web` recommended style reset -->
    <style id="expo-reset">
      /* Body and html full-height */
      html,
      body {
        height: 100%;
        margin: 0;
        padding: 0;
        background-color: #FDFBFB;
        -webkit-touch-callout: none;
        -webkit-user-select: none;
        user-select: none;
      }
      /* Prevent elastic bounce on iOS Safari */
      body {
        overflow: hidden;
        position: fixed;
        width: 100%;
        height: 100%;
      }
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
    </style>
  </head>

  <body>
    <noscript> Você precisa ativar o JavaScript para acessar o Namovo. </noscript>
    <div id="root"></div>
  </body>
</html>
